[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eda-hub"
version = "0.1.0"
description = "Benchmark Analysis — Prefix-Cube Sharing for Reversible PLA Synthesis"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
authors = [{ name = "Mitverse EDA" }]
dependencies = []

[project.optional-dependencies]
qiskit = ["qiskit>=1.0,<3"]

[project.scripts]
eda-qiskit-analysis = "eda_hub.pages.qiskit.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["eda_hub*"]

[tool.setuptools.package-data]
eda_hub = ["py.typed"]
